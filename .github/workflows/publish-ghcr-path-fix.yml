name: Publish v0.20.6 PATH-fix base to GHCR

on:
  push:
    branches: [upgrade/v0.20.6-path-fix]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-path-fix-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cpaul86/hermes-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=v0.20.6-path-fix-
          labels: |
            org.opencontainers.image.source=https://github.com/cpaul86/hermes-agent
            org.opencontainers.image.version=v0.20.6-path-fix
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ghcr-v0206-path-fix
          cache-to: type=gha,mode=max,scope=ghcr-v0206-path-fix

      - name: Report immutable image reference
        run: echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
