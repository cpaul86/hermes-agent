name: Build PATH fix image

on:
  push:
    branches:
      - deploy/path-fix-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: path-fix-image
  cancel-in-progress: true

jobs:
  build-publish-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/cpaul86/hermes-agent:path-fix-78f37b868
            ghcr.io/cpaul86/hermes-agent:path-fix-latest
          build-args: |
            HERMES_GIT_SHA=78f37b8686ed72035c9f0d5874c45bedce82055a
          cache-from: type=gha,scope=path-fix-amd64
          cache-to: type=gha,mode=max,scope=path-fix-amd64

      - name: Smoke-test launcher and PATH repair
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python             ghcr.io/cpaul86/hermes-agent:path-fix-78f37b868 -c             'import os, subprocess; from tools.environments.local import _hermes_path_repair_commands, _resolve_hermes_bin_dir; c="; ".join((*_hermes_path_repair_commands(), "test $(command -v hermes) = /opt/hermes/bin/hermes", "test $(command -v python3) = /usr/bin/python3")); r=subprocess.run(["/bin/bash", "-c", c], env={**os.environ, "PATH":"/usr/local/bin:/usr/bin:/bin"}); print(_resolve_hermes_bin_dir()); raise SystemExit(r.returncode)'

      - name: Publish immutable and rollout tags
        run: |
          docker push ghcr.io/cpaul86/hermes-agent:path-fix-78f37b868
          docker push ghcr.io/cpaul86/hermes-agent:path-fix-latest
